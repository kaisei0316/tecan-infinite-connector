[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tecan-infinite-connector"
version = "0.1.0"
description = "UniteLabs SiLA2 connector for the Tecan Infinite 200 PRO (F200 PRO) plate reader, via pylabrobot."
requires-python = ">=3.10"
dependencies = [
  "pylabrobot[usb]==0.2.2",
  "unitelabs-cdk==0.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]
